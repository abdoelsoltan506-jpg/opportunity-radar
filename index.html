<style>
/* 1. نافذة التحليل (مخفية افتراضياً) */

/* 2. حاوية العداد (نصف الدائرة) */
.gauge-container {

    width: 180px; height: 90px; 
    overflow: hidden; 
    margin: 20px auto; 
}

.gauge-background { 
    width: 100%; height: 100%;

    border-radius: 180px 180px 0 0; 
}

.gauge-cover { 
    position: absolute; top: 10px; left: 10px; width: 160px; height: 80px; 
    background: #161b22; border-radius: 160px 160px 0 0; 
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px;
}

.gauge-needle { 
    position: absolute; bottom: 0; left: 50%; width: 3px; height: 80px; 
    background: #991b1b; transform-origin: bottom center; 
    transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
}
    :root {
        --bg: #d1d5db; --panel: #44628d; --accent: #58a6ff;
        --gold: #d29922; --green: #238636;
    }
    body { font-family: 'Cairo', sans-serif; background: var(--bg); color: ##991b1b; margin:0; }
    header { background: var(--panel); padding:10px 5%; border-bottom:3px solid var(--gold); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:1000; }
    .sys-window { background:#562d19; border:1px solid var(--accent); width:450px; height:150px; overflow:hidden; position:relative; border-radius:4px; }
    .ticker { position:absolute; white-space:nowrap; color:#f11197; font-family:monospace; font-size:0.95rem; line-height:35px; left:-100%; animation:scroll-right 40s linear infinite; }
    @keyframes scroll-right { 0%{left:-100%;} 100%{left:100%;} }
    main { display:flex; gap:20px; padding:20px; max-width:1600px; margin:auto; }
    .sidebar { width:280px; flex-shrink:0; }
    .console-box { background:var(--panel); border:1px solid #30363d; padding:20px; border-radius:10px; position:sticky; top:80px; }
    label { font-size:0.8rem; color:var(--gold); display:block; margin-bottom:5px; font-weight:bold; }
    select,input,textarea { width:100%; padding:10px; margin-bottom:15px; background:#d1d5db; color:#991b1b; border:1px solid var(--accent); border-radius:6px; }
    .execute-btn { width:100%; background:var(--gold); color:#d1d5db; border:none; padding:15px; border-radius:6px; font-weight:bold; cursor:pointer; transition:0.3s; }
    .card { background:var(--panel); border:1px solid #30363d; border-radius:15px; padding:35px; margin-bottom:30px; border-right:15px solid var(--green); min-height:400px; }

    .stats-grid { 
    display:grid; 
    grid-template-columns:repeat(2,1fr); 
    gap:15px; 
}
    .stat-item { background:#506178; padding:15px; border-radius:8px; text-align:center; border:1px solid #30363d; }
    .stat-label { color:var(--accent); font-size:0.8rem; display:block; margin-bottom:5px; }
    .score-bar-bg { background:#30363d; height:12px; border-radius:10px; margin-top:20px; overflow:hidden; }
    .score-bar-fill { height:100%; transition:width 1s; }
    .loading { text-align:center; padding:100px; font-size:1.2rem; color:var(--gold); }

    /* --- لمبة الحالة --- */
    .status-indicator { display:inline-flex; align-items:center; gap:8px; background:#d1d5db; padding:5px 12px; border-radius:20px; border:1px solid #333; margin-top:5px; }
    .led-red { width:10px; height:10px; background-color:#f85149; border-radius:50%; box-shadow:0 0 10px #f85149; animation:blink-red 1s infinite; }
    .led-green { width:10px; height:10px; background-color:#238636; border-radius:50%; box-shadow:0 0 10px #238636; animation:pulse-green 2s infinite; }
    @keyframes blink-red { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
    @keyframes pulse-green { 0%{box-shadow:0 0 0 0 rgba(35,134,54,0.7);} 70%{box-shadow:0 0 0 10px rgba(35,134,54,0);} 100%{box-shadow:0 0 0 0 rgba(35,134,54,0);} }
</style>

<script>
const SB_URL = 'https://pzekjtpiseplgbbhhzod.supabase.co';
const SB_KEY = 'sb_publishable_dd_MRF-ea6L-lHcxbtfyUg_exFNdEow';
const _supabase = supabase.createClient(SB_URL, SB_KEY, {
  auth: {
    // 🟢 التعديل الجديد: يحفظ الجلسة في ذاكرة التبويب الحالي فقط
    storage: window.sessionStorage, 
    autoRefreshToken: true,
    persistSession: true, 
    detectSessionInUrl: true
  }
});
let renderIndex = 0;
const renderBatch = 10;

let db = [], fullDataStore = [], cache = { google: null, supabase: null };
let offset = 0, batchSize = 200;

// --- تغيير حالة اللمبة ---
function updateStatusToOnline() {
    const bulb = document.getElementById('led-bulb');
    const text = document.getElementById('status-text');
    bulb.className = 'led-green';
    text.innerText = 'SYSTEM_ONLINE';
    text.style.color = '#238636';
}
function updateStatusToOffline(msg='SYSTEM_OFFLINE') {
    const bulb = document.getElementById('led-bulb');
    const text = document.getElementById('status-text');
    bulb.className = 'led-red';
    text.innerText = msg;
    text.style.color = '#f85149';
}

// --- فتح/غلق نموذج الإدخال ---
function openEntryForm() {
    document.getElementById('main-content-area').style.display = 'none';
    document.getElementById('entry-section').style.display = 'block';
    const btn = document.getElementById('nav-back');
    btn.disabled = false;
    btn.style.background = "var(--gold)";
    btn.style.color = "#d1d5db";
    btn.style.cursor = "pointer";
}
function closeEntryForm() {
    document.getElementById('entry-section').style.display = 'none';
    document.getElementById('main-content-area').style.display = 'flex';
    const btn = document.getElementById('nav-back');
    btn.disabled = true;
    btn.style.background = "#30363d";
    btn.style.color = "#888";
    btn.style.cursor = "not-allowed";
}

// --- حفظ البيانات إلى Supabase ---
async function saveToSupabase() {
    // 🔴 أضف قبل payload مباشرة
const { data: userData } = await _supabase.auth.getUser();

const payload = {
    Industry: document.getElementById('in-industry').value,
    Niche: document.getElementById('in-niche').value,
    // ❌ حذفنا سطر الـ Score تماماً عشان سوباباس هو اللي هيحسبه
    Month: document.getElementById('in-month').value,
    Description: document.getElementById('in-desc').value,
    "Market Size": document.getElementById('in-market').value,
    Competition: document.getElementById('in-comp').value,
    "Growth Potential": document.getElementById('in-growth').value,
Market_Size_2: document.getElementById('in-market-2').value,
Competition_2: document.getElementById('in-comp-2').value,
Growth_2: document.getElementById('in-growth-2').value,
    SourceURL: document.getElementById('in-url').value,
    created_at: new Date(),

    // ✅ السطر الجديد (أهم شيء)
    user_id: userData.user.id
};
    const { error } = await _supabase.from('transactions').insert([payload]);
    if (!error) {
        alert("تم الحفظ!");
        cache.supabase = null;  // إعادة التحميل
        closeEntryForm();
        toggleDataSource('supabase');
    } else {
        alert("فشل الحفظ: " + error.message);
    }
}

// --- جلب البيانات (Supabase) ---
async function fetchSupabaseBatch(start=0, limit=batchSize) {
    // 🔴 أضف أول الدالة
const { data: userData } = await _supabase.auth.getUser();

const { data, error } = await _supabase
    .from('transactions')
    .select('*')

    // ✅ مهم جدًا
    .eq('user_id', userData?.user?.id) // لاحظ علامات الاستفهام للحماية

    .order('created_at', { ascending: false })
    .range(start, start + limit -1);
    if (error) throw error;
    return data || [];
}

// --- تبديل المصدر ---
																

async function toggleDataSource(source) {
    document.getElementById('nav-entry').style.display = (source === 'supabase') ? 'block' : 'none';
    updateStatusToOffline('CONNECTING...');

    if (cache[source]) {
        db = cache[source];
        finishLoading();
        return;
    }

    try {
        if (source === 'supabase') {
            let allData = [], start = 0, batch;
            do {
                batch = await fetchSupabaseBatch(start, batchSize);
                allData.push(...batch.filter(i => i && i.Niche));
                start += batchSize;
            } while (batch.length === batchSize);
            db = cache.supabase = allData.reverse();
            finishLoading();
        } else {
            // رابط الـ Deployment اللي طلعلك من جوجل سكريبت
            const GOOGLE_SCRIPT_URL = 'h';

            // مناداة البيانات للديسك توب
            fetch(GOOGLE_SCRIPT_URL)
                .then(response => response.json())
                .then(res => {
                    if (res && res.cards) {
                        cache.google = res.cards.filter(i => i && i.Niche).reverse();
                        db = cache.google;
                        finishLoading();
                    }
                })
                .catch(err => {
                    console.error("Google Fail:", err);
                    updateStatusToOffline('GOOGLE_FAIL');
                });
        }
    } catch (err) {
        updateStatusToOffline('LOAD_FAIL');
    }
}

// دالة مساعدة لتنظيف الكود
function finishLoading() {
    updateStatusToOnline();
    setupFilters();
    updateTickerWithNew();
    updateTodayCount();
}
// --- إعداد القوائم المنسدلة ---
function setupFilters() {
    const clean = v => v? v.toString().trim():null;
    const fill = (id,key) => {
        const el = document.getElementById(id);
        el.innerHTML = '<option value="">-- اختر --</option>';
        const values = [...new Set(db.map(i=>clean(i[key])).filter(Boolean))].sort();
        values.forEach(v=> el.add(new Option(v,v)));
    };
    fill('ind-filter','Industry');
    fill('month-filter','Month');
    fill('doc-filter','DocType');
    fill('year-filter','Year');
}

// --- تشغيل التحليل ---
async function executeAnalysis(){

    const ind = document.getElementById('ind-filter').value;
    const mon = document.getElementById('month-filter').value;
    const yr  = document.getElementById('year-filter').value;
    const doc = document.getElementById('doc-filter').value;

    if(!ind || !mon || !yr || !doc){
        alert("يجب اختيار كل القوائم أولا");
        return;
    }

    // 🔴 أضف في بداية الدالة
const { data: userData } = await _supabase.auth.getUser();

if (!userData || !userData.user) {
    alert("يجب تسجيل الدخول أولاً");
    return;
}
const { data, error } = await _supabase
    .from('transactions')
    .select('*')

    // ✅ السطر الجديد (فلترة المستخدم)
    .eq('user_id', userData?.user?.id || '')

    .eq('Industry', ind)
    .eq('Month', mon)
    .eq('Year', yr)
    .eq('DocType', doc)
    .order('created_at', { ascending:false });
    if(error){
        console.error(error);
        alert("حدث خطأ أثناء جلب البيانات");
        return;
    }

    fullDataStore = data || [];

    renderIndex = 0;

    const view = document.getElementById('main-view');
    view.innerHTML = '';

    render();
}
// --- عرض البيانات ---
function render() {
    const view = document.getElementById('main-view');

    // 🛑 1. حماية: إذا كانت البيانات فارغة أساساً
    if (!fullDataStore || !fullDataStore.length) {
        view.innerHTML = '<div class="loading" style="text-align:center; padding:40px; color:var(--gold);">لا توجد نتائج للعرض</div>';
        return;
    }

    // 🛑 2. حماية: إذا تم عرض كل البطاقات ووصلنا للنهاية، توقف فوراً
    if (renderIndex >= fullDataStore.length) return;

    // اقتطاع الـ 20 بطاقة التالية
    const items = fullDataStore.slice(renderIndex, renderIndex + renderBatch);
    if (!items.length) return;

    const html = items.map(item => {
        const score = parseFloat(item.Score || 0);
        const color = score >= 80 ? '#238636' : (score >= 60 ? '#d29922' : '#f85149');

        return `<div class="card" style="border-right-color:${color}">

                <div style="text-align:left;">
                    
                    <br>
                    <small style="color:var(--gold); font-weight:bold;">${item.Month || ''}</small>
                </div>
            </div>

            <h2 style="font-size:2rem; margin:15px 0;">${item.Niche || ''}</h2>
            <!-- الشريط المدرج (مقسم إلى 10 قطاعات) -->
<!-- شريط متصل مع مسطرة ترقيم مئوية -->
<div style="margin:20px 0;">
    <div style="display:flex; justify-content:space-between; font-size:0.7rem; color:var(--gold); margin-bottom:5px; font-weight:bold;">
        <span>0%</span>
        <span>25%</span>
        <span>50%</span>
        <span>75%</span>
        <span>100%</span>
    </div>
<span style="color:${color}; font-size:1.5rem; font-weight:bold;">${score}%</span>
    <div style="background:#21262d; height:12px; border-radius:6px; overflow:hidden; border:1px solid #30363d;">
        <div style="width: ${score}%; background: ${color}; height:100%; transition: width 1s;"></div>
    </div>
</div>
            <div class="desc-box">
                ${item.Description
                    ? item.Description.replace(/\*\*(.*?)\*\*/g,'<span class="big-star">$1</span>').replace(/\n/g,'<br>')
                    : ''}
            </div>

            <div class="stats-grid">
                <div class="stat-item"><span class="stat-label">حجم السوق 1</span>${item['Market Size'] || '-'}</div>
                <div class="stat-item"><span class="stat-label">حجم السوق 2</span>${item['Market_Size_2'] || '-'}</div>
                <div class="stat-item"><span class="stat-label">المنافسة 1</span>${item.Competition || '-'}</div>
                <div class="stat-item"><span class="stat-label">المنافسة 2</span>${item['Competition_2'] || '-'}</div>
                <div class="stat-item"><span class="stat-label">النمو 1</span>${item['Growth Potential'] || '-'}</div>
                <div class="stat-item"><span class="stat-label">النمو 2</span>${item['Growth_2'] || '-'}</div>
            </div>

            ${item.SourceURL
                ? `<a href="${item.SourceURL}" target="_blank" style="padding:5px 10px; background:#f85149; color:white; border-radius:4px; font-size:0.7rem; font-weight:bold;">المصدر</a>`
                : ''}
            <div style="display: flex; gap: 8px; margin-top: 15px; width: 100%;">
            <!-- 1. زر فحص المؤشرات الأصلي (أخذ المساحة الأكبر) -->
            <button onclick="showAnalysis('${encodeURIComponent(JSON.stringify(item))}')" 
                    style="flex: 2; background: var(--green); color: #991b1b; border: none; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo';">
                🔍 فحص المؤشرات
            </button>

            <!-- 2. زر التعديل -->
            <!-- زر التعديل المعدل -->
<button onclick="editItem(${item.id || item.ID})" 
              style="flex: 1; background: #21262d; color: #b197fc; border: 1px                    solid #30363d; padding: 10px; border-radius: 8px; cursor: pointer;            font-weight: bold; font-family: 'Cairo';">
    ✏️ تعديل
</button>
            <!-- 3. زر الحذف -->
            <button onclick="deleteItem('${item.id}')" 
                    style="flex: 1; background: #21262d; color: #f85149; border: 1px solid #30363d; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; font-family: 'Cairo';">
                🗑️ حذف
            </button>
        </div>
    </div>`;
}).join('');
    view.insertAdjacentHTML('beforeend', html);
    renderIndex += renderBatch; // زيادة العداد للدفعة التالية
}

// --- دالة تسجيل الدخول (المعدلة لتعمل فوراً) ---
async function handleLogin() {
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-pass').value;
    const msg = document.getElementById('login-msg');

    if (!email || !pass) {
        msg.innerText = "اكتب البيانات يا عكيد";
        return;
    }

    msg.innerText = "جاري التحقق...";
    const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: pass,
    });

    if (error) {
        msg.innerText = "خطأ: " + error.message;
    } else {
        msg.innerText = "تم الدخول بنجاح! جاري فتح الرادار...";
        
        // 🟢 التعديل هنا: ننتظر نص ثانية قبل التحديث لضمان استقرار الدخول
        setTimeout(() => {
            window.location.reload();
        }, 500); 
    }
}
// --- فحص المستخدم عند فتح الصفحة ---
async function checkUserOnLoad() {
    const { data: { session } } = await _supabase.auth.getSession();
    
    if (session) {
        document.getElementById('login-screen').style.display = 'none';
        
        // التعديل المطلوب: إجبار القائمة على اختيار سوبا باس برمجياً
        const sourceSelect = document.getElementById('data-source-select');
        sourceSelect.value = 'supabase'; 
        
        toggleDataSource('supabase');  
    } else {
        document.getElementById('login-screen').style.display = 'flex';
    }
}
async function handleLogout() {
    await _supabase.auth.signOut();
    window.location.reload(); // لإعادة تحميل الصفحة واجبار النظام على طلب تسجيل الدخول
}

// دالة فتح النافذة وعرض التحليل

    </div>

function openDashboard() {

    if (!db || db.length === 0) {
        alert("لا توجد بيانات");
        return;
    }

    const industryMap = {};

    db.forEach(item => {
        const ind = item.Industry || "Unknown";
        const score = parseFloat(item.Score || 0);

        if (!industryMap[ind]) {
            industryMap[ind] = { total: 0, count: 0 };
        }

        industryMap[ind].total += score;
        industryMap[ind].count += 1;
    });

    let bestIndustry = "";
    let worstIndustry = "";
    let bestAvg = -Infinity;
    let worstAvg = Infinity;

    Object.keys(industryMap).forEach(ind => {
        const avg = industryMap[ind].total / industryMap[ind].count;

        if (avg > bestAvg) {
            bestAvg = avg;
            bestIndustry = ind;
        }

        if (avg < worstAvg) {
            worstAvg = avg;
            worstIndustry = ind;
        }
    });

    const avgScore = db.reduce((s,i)=>s+(parseFloat(i.Score)||0),0) / db.length;

    document.getElementById("main-view").innerHTML = `
        <div class="card">
            <h2>📊 Dashboard Mode</h2>

            <div class="stats-grid" style="margin-top:20px;">
                <div class="stat-item">
                    <span class="stat-label">أفضل قطاع</span>
                    ${bestIndustry}
                </div>

                <div class="stat-item">
                    <span class="stat-label">أضعف قطاع</span>
                    ${worstIndustry}
                </div>

                <div class="stat-item">
                    <span class="stat-label">متوسط السوق</span>
                    ${avgScore.toFixed(1)}%
                </div>
            </div>

            <button onclick="backToSystem()" style="margin-top:20px; background:#238636; color:white; padding:10px 18px; border:none; border-radius:6px; cursor:pointer; font-weight:bold;">
    العودة للنظام 🏠
</button>
        </div>
    `;
}
// دالة إغلاق النافذة
function closeAnalysis() {
    document.getElementById('analysis-modal').style.display = 'none';
}
function backToSystem() {
    if (!db || db.length === 0) {
        alert("لا توجد بيانات لإعادة العرض");
        return;
    }

    fullDataStore = db;   // 🔥 إعادة ربط البيانات الأساسية
    renderIndex = 0;

    document.getElementById("main-view").innerHTML = "";
    render();
}
// --- التمرير اللانهائي (Infinite Scroll) ---
window.addEventListener('scroll', () => {
    if (typeof renderIndex !== 'undefined' && typeof fullDataStore !== 'undefined') {
        if (renderIndex >= fullDataStore.length) return;

        const scrollPosition = window.innerHeight + window.scrollY;
        const threshold = document.documentElement.offsetHeight - 300;

        if (scrollPosition >= threshold) {
            if (typeof render === 'function') render();
            else if (typeof renderNextBatch === 'function') renderNextBatch();
        }
    }
});

// --- 1. دالة الحذف المباشر (الشغالة) ---
async function deleteItem(id) {
    const confirmDelete = confirm("هل أنت متأكد من حذف هذه الفرصة نهائياً؟");
    if (!confirmDelete) return;

    try {
        const numericId = parseInt(id, 10);

        const { error } = await _supabase
            .from('transactions')
            .delete()
            .eq('id', numericId);

        if (error) throw error;

        alert("تم الحذف بنجاح من قاعدة البيانات! 🗑️");
        
        if (typeof db !== 'undefined') db = db.filter(item => item.id != id);
        if (typeof fullDataStore !== 'undefined') fullDataStore = fullDataStore.filter(item => item.id != id);
        
        if (typeof render === 'function') {
            render();
        } else if (typeof backToSystem === 'function') {
            backToSystem();
        } else {
            location.reload(); 
        }

    } catch (err) {
        alert("حدث خطأ أثناء الحذف: " + err.message);
    }
}

// --- 2. دالة التعديل والحفظ ---
let editingItemId = null;

function editItem(id) {
    const numericId = parseInt(id, 10);
    const dataStore = (typeof db !== 'undefined' && db.length > 0) ? db : (typeof fullDataStore !== 'undefined' ? fullDataStore : []);
    const currentItem = dataStore.find(item => (item.id || item.ID) == numericId);
    
    if (!currentItem) {
        alert("لم يتم العثور على بيانات هذه الفرصة!");
        return;
    }

    editingItemId = numericId;

    const setVal = (elemId, val) => {
        const el = document.getElementById(elemId);
        if (el) el.value = val || '';
    };

    setVal('in-industry', currentItem.Industry);
    setVal('in-niche', currentItem.Niche);
    setVal('in-month', currentItem.Month);
    setVal('in-desc', currentItem.Description);
    setVal('in-market', currentItem["Market Size"]);
    setVal('in-comp', currentItem.Competition);
    setVal('in-growth', currentItem["Growth Potential"]);
    setVal('in-url', currentItem.SourceURL);

    if (typeof openEntryForm === 'function') openEntryForm();
}

async function saveItem(event) {
    if (event && event.preventDefault) event.preventDefault();

    try {
        const { data: userData } = await _supabase.auth.getUser();
        const userId = userData?.user?.id || null;

        const getVal = (elemId) => {
            const el = document.getElementById(elemId);
            return el ? el.value : '';
        };

        const payload = {
            Industry: getVal('in-industry'),
            Niche: getVal('in-niche'),
            Month: getVal('in-month'),
            Description: getVal('in-desc'),
            "Market Size": getVal('in-market'),
            Competition: getVal('in-comp'),
            "Growth Potential": getVal('in-growth'),
            SourceURL: getVal('in-url'),
            user_id: userId
        };

        let result;

        if (editingItemId) {
            result = await _supabase
                .from('transactions')
                .update(payload)
                .eq('id', editingItemId);
        } else {
            payload.created_at = new Date().toISOString();
            result = await _supabase
                .from('transactions')
                .insert([payload]);
        }

        if (result.error) throw result.error;

        alert(editingItemId ? "تم تعديل البيانات بنجاح! ✏️" : "تم الحفظ بنجاح! 💾");

        editingItemId = null;
        if (typeof cache !== 'undefined') cache.supabase = null;
        if (typeof closeEntryForm === 'function') closeEntryForm();
        if (typeof render === 'function') render();
        else if (typeof backToSystem === 'function') backToSystem();

    } catch (err) {
        alert("فشل الحفظ: " + err.message);
    }
}
