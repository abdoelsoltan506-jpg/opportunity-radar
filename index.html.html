<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Enterprise V6 - Optimized</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        #analysis-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.9); z-index: 99999; align-items: center; justify-content: center; }
        .gauge-container { position: relative; width: 180px; height: 90px; overflow: hidden; margin: 20px auto; }
        .gauge-background { width: 100%; height: 100%; background: conic-gradient(from -90deg at 50% 100%, #f85149, #d29922, #238636); border-radius: 180px 180px 0 0; }
        .gauge-cover { position: absolute; top: 10px; left: 10px; width: 160px; height: 80px; background: #161b22; border-radius: 160px 160px 0 0; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 5px;}
        .gauge-needle { position: absolute; bottom: 0; left: 50%; width: 3px; height: 80px; background: #fff; transform-origin: bottom center; transition: transform 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        :root { --bg: #0d1117; --panel: #161b22; --accent: #58a6ff; --gold: #d29922; --green: #238636; }
        body { font-family: 'Cairo', sans-serif; background: var(--bg); color: #c9d1d9; margin:0; }
        header { background: var(--panel); padding:10px 5%; border-bottom:3px solid var(--gold); display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:1000; }
        .sys-window { background:#562d19; border:1px solid var(--accent); width:450px; height:150px; overflow:hidden; position:relative; border-radius:4px; }
        .ticker { position:absolute; white-space:nowrap; color:#f11197; font-family:monospace; font-size:0.95rem; line-height:35px; left:-100%; animation:scroll-right 40s linear infinite; }
        @keyframes scroll-right { 0%{left:-100%;} 100%{left:100%;} }
        main { display:flex; gap:20px; padding:20px; max-width:1600px; margin:auto; }
        .sidebar { width:280px; flex-shrink:0; }
        .console-box { background:var(--panel); border:1px solid #30363d; padding:20px; border-radius:10px; position:sticky; top:80px; }
        label { font-size:0.8rem; color:var(--gold); display:block; margin-bottom:5px; font-weight:bold; }
        select,input,textarea { width:100%; padding:10px; margin-bottom:15px; background:#000; color:#fff; border:1px solid var(--accent); border-radius:6px; }
        .execute-btn { width:100%; background:var(--gold); color:#000; border:none; padding:15px; border-radius:6px; font-weight:bold; cursor:pointer; transition:0.3s; }
        .card { background:var(--panel); border:1px solid #30363d; border-radius:15px; padding:35px; margin-bottom:30px; border-right:15px solid var(--green); min-height:400px; }
        .big-star { font-size:1.6rem; color:#ff9d00; font-weight:900; display:inline-block; margin:10px 0; text-shadow:0 0 10px rgba(255,157,0,0.3); }
        .desc-box { background:#0d1117; padding:25px; border-radius:10px; line-height:2.2; font-size:1.25rem; margin:20px 0; border:1px solid #21262d; }
        .stats-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:15px; }
        .stat-item { background:#21262d; padding:15px; border-radius:8px; text-align:center; border:1px solid #30363d; }
        .stat-label { color:var(--accent); font-size:0.8rem; display:block; margin-bottom:5px; }
        .loading { text-align:center; padding:100px; font-size:1.2rem; color:var(--gold); }
        .status-indicator { display:inline-flex; align-items:center; gap:8px; background:#000; padding:5px 12px; border-radius:20px; border:1px solid #333; margin-top:5px; }
        .led-red { width:10px; height:10px; background-color:#f85149; border-radius:50%; box-shadow:0 0 10px #f85149; animation:blink-red 1s infinite; }
        .led-green { width:10px; height:10px; background-color:#238636; border-radius:50%; box-shadow:0 0 10px #238636; animation:pulse-green 2s infinite; }
        @keyframes blink-red { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
        @keyframes pulse-green { 0%{box-shadow:0 0 0 0 rgba(35,134,54,0.7);} 70%{box-shadow:0 0 0 10px rgba(35,134,54,0);} 100%{box-shadow:0 0 0 0 rgba(35,134,54,0);} }
    </style>
</head>
<body>
<div id="analysis-modal">
    <div style="background:#161b22; width:90%; max-width:450px; padding:30px; border-radius:15px; border:2px solid #d29922; text-align:center; position:relative;">
        <button onclick="closeAnalysis()" style="position:absolute; top:10px; left:10px; background:none; border:none; color:#888; cursor:pointer; font-size:1.2rem;">✕</button>
        <h2 id="modal-title" style="color:#58a6ff; margin-bottom:10px;">--</h2>
        <div class="gauge-container">
            <div class="gauge-background"></div>
            <div class="gauge-cover">
                <span id="modal-score" style="font-size:1.8rem; font-weight:800; color:#fff;">0%</span>
            </div>
            <div id="modal-needle" class="gauge-needle"></div>
        </div>
        <div style="height: 200px; width: 100%; margin: 20px 0;">
            <canvas id="opportunityChart"></canvas>
        </div>
        <div id="modal-details" style="display:grid; grid-template-columns:1fr 1fr; gap:10px;"></div>
    </div>
</div>

<div id="login-screen" style="position:fixed; top:0; left:0; width:100%; height:100%; background:var(--bg); z-index:9999; display:flex; align-items:center; justify-content:center; flex-direction:column; padding:20px;">
    <div style="background:var(--panel); padding:40px; border-radius:15px; border:2px solid var(--gold); width:100%; max-width:400px; text-align:center;">
        <h2 style="color:var(--gold); margin-bottom:20px;">دخول العضوية 🔑</h2>
        <input type="email" id="login-email" placeholder="البريد الإلكتروني" style="margin-bottom:15px;">
        <input type="password" id="login-pass" placeholder="كلمة السر" style="margin-bottom:20px;">
        <button onclick="handleLogin()" class="execute-btn" style="background:var(--green); color:white;">دخول النظام</button>
        <p id="login-msg" style="color:#f85149; margin-top:15px; font-size:0.8rem;"></p>
    </div>
</div>

<header>
    <div>
        <h2 style="margin:0; color:var(--accent);">RADAR_ENTERPRISE</h2>
        <div class="status-indicator">
            <div id="led-bulb" class="led-red"></div>
            <span id="status-text" style="font-size:0.7rem; font-weight:bold; color:#f85149;">OFFLINE</span>
        </div>
        <div id="today-count" style="font-size:0.75rem; color:var(--gold); margin-top:5px;">عمليات اليوم: 0</div>
    </div>
    <button onclick="handleLogout()" style="background:#f85149; color:white; border:none; padding:5px 12px; border-radius:6px; font-size:0.75rem; cursor:pointer; font-weight:bold;">خروج 🚪</button>
    <div class="sys-window">
        <div class="ticker" id="ticker-stream">INITIALIZING...</div>
    </div>
</header>

<div style="display:flex; gap:15px; padding:20px 5%; background:#161b22; border-bottom:1px solid #30363d; align-items:center;">
    <button id="nav-back" onclick="closeEntryForm()" style="background:#30363d; color:#888; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:not-allowed;" disabled>رجوع للعرض</button>
    <button id="nav-entry" onclick="openEntryForm()" style="background:var(--green); color:#fff; border:none; padding:10px 20px; border-radius:6px; font-weight:bold; cursor:pointer;">إدخال بيانات</button>
</div>

<main id="main-content-area">
    <aside class="sidebar">
        <div class="console-box">
            <div style="display:flex; gap:5px; margin-bottom:20px; background:#000; padding:5px; border-radius:8px; border:1px solid #333;">
                <button onclick="backToSystem()">ــــــــــ</button>
                <button onclick="switchToMode('all')" id="btn-mode-all" style="flex:1; padding:8px; border:none; border-radius:5px; cursor:pointer; background:var(--gold); color:#000; font-weight:bold; font-size:0.75rem;">إطلاع الكل</button>
                <button onclick="switchToMode('today')" id="btn-mode-today" style="flex:1; padding:8px; border:none; border-radius:5px; cursor:pointer; background:#161b22; color:#888; font-weight:bold; font-size:0.75rem;">عمليات اليوم</button>
            </div>
            <label>1. القطاع:</label><select id="ind-filter"><option value="">اختر</option></select>
            <label>2. الشهر:</label><select id="month-filter"><option value="">اختر</option></select>
            <label>3. السنة:</label><select id="year-filter"><option value="">اختر</option></select>
            <label>4. نوع المستند:</label><select id="doc-filter"><option value="">اختر</option></select>
            <button class="execute-btn" id="exec-btn">RUN ANALYSIS ></button>
        </div>
    </aside>
    <section class="display-area" id="main-view">
        <div class="loading">// حدد المعايير للعرض</div>
    </section>
</main>

<section id="entry-section" style="display:none; max-width:800px; margin:20px auto; padding:30px; background:var(--panel); border:2px solid var(--accent); border-radius:15px;">
    <h2 style="color:var(--gold); border-bottom:1px solid var(--accent); padding-bottom:10px; margin-bottom:25px;">إضافة سجل جديد</h2>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
        <div><label>القطاع:</label><input type="text" id="in-industry"></div>
        <div><label>التخصص:</label><input type="text" id="in-niche"></div>
        <div><label>الشهر:</label><input type="text" id="in-month"></div>
        <div style="grid-column:span 2;"><label>الوصف:</label><textarea id="in-desc" rows="4"></textarea></div>
        <div><label>حجم السوق الحالى :</label><input type="number" id="in-market"></div>
        <div><label>قوة الطلب الفعلى:</label><input type="number" id="in-market-2"></div>
        <div><label>عدد المنافسين:</label><input type="number" id="in-comp"></div>
        <div><label>قوة المنافسين:</label><input type="number" id="in-comp-2"></div>
        <div><label>اشارات النمو الحالية:</label><input type="number" id="in-growth"></div>
        <div><label>استمرار النمو المتوقع:</label><input type="number" id="in-growth-2"></div>
        <div><label>رابط المصدر:</label><input type="text" id="in-url"></div>
    </div>
    <button onclick="saveToSupabase()" class="execute-btn" style="margin-top:30px; background:var(--green); color:white;">حفظ</button>
</section>

<script>
const SB_URL = 'https://pzekjtpiseplgbbhhzod.supabase.co';
const SB_KEY = 'sb_publishable_dd_MRF-ea6L-lHcxbtfyUg_exFNdEow';
const _supabase = supabase.createClient(SB_URL, SB_KEY, {
  auth: {
    storage: window.sessionStorage, 
    autoRefreshToken: true,
    persistSession: true, 
    detectSessionInUrl: true
  }
});

let renderIndex = 0;
const renderBatch = 20;
let db = [], fullDataStore = [];
let batchSize = 200;

function updateStatusToOnline() {
    const bulb = document.getElementById('led-bulb');
    const text = document.getElementById('status-text');
    bulb.className = 'led-green';
    text.innerText = 'SYSTEM_ONLINE';
    text.style.color = '#238636';
}

function updateStatusToOffline(msg='SYSTEM_OFFLINE') {
    const bulb = document.getElementById('led-bulb');
    const text = document.getElementById('status-text');
    bulb.className = 'led-red';
    text.innerText = msg;
    text.style.color = '#f85149';
}

function openEntryForm() {
    document.getElementById('main-content-area').style.display = 'none';
    document.getElementById('entry-section').style.display = 'block';
    const btn = document.getElementById('nav-back');
    btn.disabled = false;
    btn.style.background = "var(--gold)";
    btn.style.color = "#000";
    btn.style.cursor = "pointer";
}

function closeEntryForm() {
    document.getElementById('entry-section').style.display = 'none';
    document.getElementById('main-content-area').style.display = 'flex';
    const btn = document.getElementById('nav-back');
    btn.disabled = true;
    btn.style.background = "#30363d";
    btn.style.color = "#888";
    btn.style.cursor = "not-allowed";
}

async function saveToSupabase() {
    const { data: userData } = await _supabase.auth.getUser();
    if (!userData || !userData.user) {
        alert("يجب تسجيل الدخول أولاً");
        return;
    }

    const payload = {
        Industry: document.getElementById('in-industry').value,
        Niche: document.getElementById('in-niche').value,
        Month: document.getElementById('in-month').value,
        Description: document.getElementById('in-desc').value,
        "Market Size": parseFloat(document.getElementById('in-market').value) || 0,
        Competition: parseFloat(document.getElementById('in-comp').value) || 0,
        "Growth Potential": parseFloat(document.getElementById('in-growth').value) || 0,
        Market_Size_2: parseFloat(document.getElementById('in-market-2').value) || 0,
        Competition_2: parseFloat(document.getElementById('in-comp-2').value) || 0,
        Growth_2: parseFloat(document.getElementById('in-growth-2').value) || 0,
        SourceURL: document.getElementById('in-url').value,
        created_at: new Date(),
        user_id: userData.user.id
    };

    const { error } = await _supabase.from('transactions').insert([payload]);
    if (!error) {
        alert("تم الحفظ بنجاح!");
        closeEntryForm();
        loadSupabaseData();
    } else {
        alert("فشل الحفظ: " + error.message);
    }
}

async function fetchSupabaseBatch(start=0, limit=batchSize) {
    const { data: userData } = await _supabase.auth.getUser();
    const { data, error } = await _supabase
        .from('transactions')
        .select('*')
        .eq('user_id', userData?.user?.id || '')
        .order('created_at', { ascending: false })
        .range(start, start + limit - 1);

    if (error) throw error;
    return data || [];
}

async function loadSupabaseData() {
    updateStatusToOffline('CONNECTING...');
    try {
        let allData = [], start = 0, batch;
        do {
            batch = await fetchSupabaseBatch(start, batchSize);
            allData.push(...batch.filter(i => i && i.Niche));
            start += batchSize;
        } while (batch.length === batchSize);
        db = allData.reverse();
        finishLoading();
    } catch (err) {
        updateStatusToOffline('LOAD_FAIL');
    }
}

function finishLoading() {
    updateStatusToOnline();
    setupFilters();
    updateTickerWithNew();
    updateTodayCount();
}

function setupFilters() {
    const clean = v => v ? v.toString().trim() : null;
    const fill = (id, key) => {
        const el = document.getElementById(id);
        el.innerHTML = '<option value="">-- اختر --</option>';
        const values = [...new Set(db.map(i => clean(i[key])).filter(Boolean))].sort();
        values.forEach(v => el.add(new Option(v, v)));
    };
    fill('ind-filter', 'Industry');
    fill('month-filter', 'Month');
    fill('doc-filter', 'DocType');
    fill('year-filter', 'Year');
}

async function executeAnalysis() {
    const ind = document.getElementById('ind-filter').value;
    const mon = document.getElementById('month-filter').value;
    const yr  = document.getElementById('year-filter').value;
    const doc = document.getElementById('doc-filter').value;

    if (!ind || !mon || !yr || !doc) {
        alert("يجب اختيار كل القوائم أولا");
        return;
    }

    const { data: userData } = await _supabase.auth.getUser();
    if (!userData || !userData.user) {
        alert("يجب تسجيل الدخول أولاً");
        return;
    }

    const { data, error } = await _supabase
        .from('transactions')
        .select('*')
        .eq('user_id', userData.user.id)
        .eq('Industry', ind)
        .eq('Month', mon)
        .eq('Year', yr)
        .eq('DocType', doc)
        .order('created_at', { ascending: false });

    if (error) {
        console.error(error);
        alert("حدث خطأ أثناء جلب البيانات");
        return;
    }

    fullDataStore = data || [];
    renderIndex = 0;
    const view = document.getElementById('main-view');
    view.innerHTML = '';
    render();
}

function render() {
    const view = document.getElementById('main-view');
    if (!fullDataStore.length) {
        view.innerHTML = '<div class="loading">لا توجد نتائج</div>';
        return;
    }

    const items = fullDataStore.slice(renderIndex, renderIndex + renderBatch);
    if (!items.length) return;

    const html = items.map(item => {
        const score = parseFloat(item.Score || 0).toFixed(1);
        const color = score >= 80 ? '#238636' : (score >= 60 ? '#d29922' : '#f85149');
        return `<div class="card" style="border-right-color:${color}">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="color:var(--accent); font-weight:bold;">[ ${item.Industry} ]</span>
                <div style="text-align:left;">
                    <span style="color:${color}; font-size:1.5rem; font-weight:bold;">${score}%</span>
                    <br>
                    <small style="color:var(--gold); font-weight:bold;">${item.Month||''}</small>
                </div>
            </div>
            <h2 style="font-size:2rem; margin:15px 0;">${item.Niche}</h2> 
            <div style="background:#30363d; height:12px; border-radius:10px; margin:20px 0; overflow:hidden;">
                <div style="width: ${score}%; background: ${color}; height:100%; transition: width 1s;"></div>
            </div>
            <div class="desc-box">
                ${item.Description
                    ? item.Description.replace(/\*\*(.*?)\*\*/g,'<span class="big-star">$1</span>').replace(/\n/g,'<br>')
                    : ''}
            </div>
            <div class="stats-grid">
                <div class="stat-item"><span class="stat-label">حجم السوق 1</span>${item['Market Size']||'-'}</div>
                <div class="stat-item"><span class="stat-label">حجم السوق 2</span>${item['Market_Size_2']||'-'}</div>
                <div class="stat-item"><span class="stat-label">المنافسة 1</span>${item.Competition||'-'}</div>
                <div class="stat-item"><span class="stat-label">المنافسة 2</span>${item['Competition_2']||'-'}</div>
                <div class="stat-item"><span class="stat-label">النمو 1</span>${item['Growth Potential']||'-'}</div>
                <div class="stat-item"><span class="stat-label">النمو 2</span>${item['Growth_2']||'-'}</div>
            </div>
            ${item.SourceURL
                ? `<a href="${item.SourceURL}" target="_blank" style="padding:5px 10px; background:#f85149; color:white; border-radius:4px; font-size:0.7rem; font-weight:bold; display:inline-block; margin-top:10px;">المصدر</a>`
                : ''}
            <button onclick="showAnalysis('${encodeURIComponent(JSON.stringify(item))}')" style="width:100%; background:var(--green); color:#fff; border:none; padding:12px; border-radius:8px; cursor:pointer; margin-top:15px; font-weight:bold; font-family:'Cairo';">
                🔍 فحص مؤشرات الرادار
            </button>
        </div>`;
    }).join('');

    view.insertAdjacentHTML('beforeend', html);
    renderIndex += renderBatch;
}

function updateTickerWithNew() {
    const ticker = document.getElementById('ticker-stream');
    if (db && db.length > 0) {
        const newsUpdates = db.slice(0, 20).map(i => i.New ? i.New : '').filter(Boolean).join(' ⚡ ');
        ticker.innerText = newsUpdates || "SYSTEM_READY: NO_NEW_UPDATES_FOUND";
    }
}

function switchToMode(mode) {
    const btnAll = document.getElementById('btn-mode-all');
    const btnToday = document.getElementById('btn-mode-today');
    if (mode === 'today') {
        btnToday.style.background = 'var(--gold)'; btnToday.style.color = '#000';
        btnAll.style.background = '#161b22'; btnAll.style.color = '#888';
        const todayISO = new Date().toISOString().split('T')[0];
        fullDataStore = db.filter(item => {
            const d = new Date(item.created_at || item.Date || item.date);
            if (isNaN(d)) return false;
            return d.toISOString().split('T')[0] === todayISO;
        }).sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
        renderIndex = 0;
        document.getElementById('main-view').innerHTML = '';
        render();
    } else {
        btnAll.style.background = 'var(--gold)'; btnAll.style.color = '#000';
        btnToday.style.background = '#161b22'; btnToday.style.color = '#888';
        fullDataStore = db;
        renderIndex = 0;
        document.getElementById('main-view').innerHTML = '';
        render();
    }
}

function updateTodayCount() {
    const today = new Date().toISOString().split('T')[0];
    const count = db.filter(item => {
        const d = new Date(item.created_at || item.Date || item.date);
        if (isNaN(d)) return false;
        return d.toISOString().split('T')[0] === today;
    }).length;
    document.getElementById("today-count").innerText = "عمليات اليوم: " + count;
}

document.getElementById('exec-btn').onclick = executeAnalysis;

async function handleLogin() {
    const email = document.getElementById('login-email').value;
    const pass = document.getElementById('login-pass').value;
    const msg = document.getElementById('login-msg');
    if (!email || !pass) {
        msg.innerText = "اكتب البيانات يا عكيد";
        return;
    }
    msg.innerText = "جاري التحقق...";
    const { data, error } = await _supabase.auth.signInWithPassword({
        email: email,
        password: pass,
    });
    if (error) {
        msg.innerText = "خطأ: " + error.message;
    } else {
        msg.innerText = "تم الدخول بنجاح! جاري فتح الرادار...";
        setTimeout(() => {
            window.location.reload();
        }, 500);
    }
}

async function checkUserOnLoad() {
    const { data: { session } } = await _supabase.auth.getSession();
    if (session) {
        document.getElementById('login-screen').style.display = 'none';
        loadSupabaseData();
    } else {
        document.getElementById('login-screen').style.display = 'flex';
    }
}

async function handleLogout() {
    await _supabase.auth.signOut();
    window.location.reload();
}

checkUserOnLoad();

let myChart = null;
function showAnalysis(itemData) {
    const item = JSON.parse(decodeURIComponent(itemData));
    const score = parseFloat(item.Score || 0).toFixed(1);
    const rotation = (score / 100) * 180 - 90;

    document.getElementById('modal-title').innerText = item.Niche;
    document.getElementById('modal-score').innerText = score + "%";
    document.getElementById('modal-needle').style.transform = `rotate(${rotation}deg)`;
    
    document.getElementById('modal-details').innerHTML = `
        <div style="background:#0d1117; padding:8px; border-radius:5px; border:1px solid #333;"><small>حجم السوق 1</small><br>${item['Market Size'] || '-'}</div>
        <div style="background:#0d1117; padding:8px; border-radius:5px; border:1px solid #333;"><small>حجم السوق 2</small><br>${item.Market_Size_2 || '-'}</div>
        <div style="background:#0d1117; padding:8px; border-radius:5px; border:1px solid #333;"><small>المنافسة 1</small><br>${item.Competition || '-'}</div>
        <div style="background:#0d1117; padding:8px; border-radius:5px; border:1px solid #333;"><small>المنافسة 2</small><br>${item.Competition_2 || '-'}</div>
        <div style="background:#0d1117; padding:8px; border-radius:5px; border:1px solid #333;"><small>النمو 1</small><br>${item['Growth Potential'] || '-'}</div>
        <div style="background:#0d1117; padding:8px; border-radius:5px; border:1px solid #333;"><small>النمو 2</small><br>${item.Growth_2 || '-'}</div>
    `;

    if (myChart) { myChart.destroy(); }
    const ctx = document.getElementById('opportunityChart').getContext('2d');
    myChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['السوق', 'المنافسة', 'النمو'],
            datasets: [{
                label: 'المؤشر الرقمي',
                data: [
                    parseFloat(item['Market Size']) || 0, 
                    parseFloat(item.Competition) || 0, 
                    parseFloat(item['Growth Potential']) || 0
                ],
                backgroundColor: ['#58a6ff', '#f85149', '#238636'],
                borderRadius: 4
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
                y: { beginAtZero: true, max: 100, ticks: { color: '#666' } },
                x: { ticks: { color: '#fff', font: { family: 'Cairo' } } }
            }
        }
    });
    document.getElementById('analysis-modal').style.display = 'flex';
}

function closeAnalysis() {
    document.getElementById('analysis-modal').style.display = 'none';
}

function backToSystem() {
    if (!db || db.length === 0) {
        alert("لا توجد بيانات لإعادة العرض");
        return;
    }
    fullDataStore = db;
    renderIndex = 0;
    document.getElementById("main-view").innerHTML = "";
    render();
}
</script>
</body>
</html>
